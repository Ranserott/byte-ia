<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Byte IA — Tu Asistente Personal</title>
  <!-- Markdown renderer (Mejora 4) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e8f0;
      --text-dim: #8888a0;
      --accent: #f54a00;
      --accent-glow: rgba(245, 74, 0, 0.4);
      --success: #00a63e;
      --error: #e7000b;
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 24px;
      background:
        radial-gradient(ellipse at top, rgba(245, 74, 0, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(245, 74, 0, 0.04) 0%, transparent 50%),
        var(--bg);
    }

    /* === HEADER === */
    .header {
      text-align: center;
      width: 100%;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f54a00 0%, #ff7733 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* === ORB === */
    .orb-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
    }

    .orb {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, var(--accent-glow) 50%, transparent 80%);
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb:hover { transform: scale(1.05); }
    .orb:active { transform: scale(0.95); }

    .orb.listening {
      animation: pulse-listening 1.2s ease-in-out infinite;
      background: radial-gradient(circle, var(--cyan) 0%, var(--cyan-glow) 50%, transparent 80%);
    }

    .orb.thinking {
      animation: pulse-thinking 0.8s ease-in-out infinite;
      background: radial-gradient(circle, #eab308 0%, rgba(234, 179, 8, 0.4) 50%, transparent 80%);
    }

    .orb.speaking {
      animation: pulse-speaking 0.6s ease-in-out infinite;
      background: radial-gradient(circle, #10b981 0%, rgba(16, 185, 129, 0.4) 50%, transparent 80%);
    }

    /* Wake word: cyan intenso */
    .orb.wake-word {
      animation: pulse-wake 0.4s ease-in-out infinite;
      background: radial-gradient(circle, var(--cyan) 0%, var(--cyan-glow) 60%, transparent 90%);
    }

    @keyframes pulse-listening {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes pulse-thinking {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(180deg); }
    }
    @keyframes pulse-speaking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes pulse-wake {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 var(--cyan-glow); }
      50% { transform: scale(1.2); box-shadow: 0 0 40px 10px var(--cyan-glow); }
    }

    .orb-icon {
      font-size: 80px;
      color: rgba(255, 255, 255, 0.9);
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
    }

    .status-text {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* === TRANSCRIPT === */
    .transcript {
      width: 100%;
      max-width: 600px;
      min-height: 80px;
      max-height: 240px;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .transcript:empty::before {
      content: "Tus conversaciones aparecerán aquí...";
      color: var(--text-dim);
      font-style: italic;
    }

    .message {
      margin-bottom: 12px;
    }

    .message.user {
      color: var(--accent);
    }

    .message.jarvis {
      color: var(--text);
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      font-weight: 600;
      margin-right: 8px;
    }

    /* === MARKDOWN CONTENT (Mejora 4) === */
    .markdown-content {
      display: inline;
    }
    .markdown-content p {
      display: block;
      margin-bottom: 8px;
    }
    .markdown-content p:last-child {
      margin-bottom: 0;
    }
    .markdown-content code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 12px;
    }
    .markdown-content pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      display: block;
    }
    .markdown-content pre code {
      background: none;
      padding: 0;
      font-size: 12px;
    }
    .markdown-content strong {
      font-weight: 700;
      color: var(--accent);
    }
    .markdown-content em {
      font-style: italic;
    }
    .markdown-content ul,
    .markdown-content ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }
    .markdown-content li {
      margin-bottom: 4px;
    }
    .markdown-content a {
      color: var(--accent);
      text-decoration: underline;
    }
    .markdown-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--text-dim);
      font-style: italic;
    }
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3 {
      color: var(--accent);
      margin: 8px 0 4px 0;
      font-weight: 600;
    }
    .markdown-content h1 { font-size: 18px; }
    .markdown-content h2 { font-size: 16px; }
    .markdown-content h3 { font-size: 14px; }

    /* === CONFIG PANEL === */
    .config-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .config-toggle:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .config-panel {
      position: fixed;
      top: 60px;
      right: 16px;
      width: 360px;
      max-width: calc(100vw - 32px);
      background: rgba(20, 20, 30, 0.98);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(20px);
      display: none;
      z-index: 100;
    }

    .config-panel.open { display: block; }

    .config-panel h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }

    .save-btn:hover { background: #ff6633; }

    /* === COMMANDS === */
    .commands {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }

    .cmd-btn {
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cmd-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <!-- Botón de config -->
  <button class="config-toggle" id="configToggle" title="Configuración">⚙</button>

  <!-- Panel de configuración -->
  <div class="config-panel" id="configPanel">
    <h3>Configuración</h3>
    <div class="form-group">
      <label>API Key (MiniMax)</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label>Modelo</label>
      <select id="model">
        <option value="MiniMax-Text-01">MiniMax-Text-01</option>
      </select>
    </div>
    <div class="form-group">
      <label>Voz (TTS)</label>
      <select id="voice">
        <option value="Monica">Monica (es-MX, recomendada)</option>
        <option value="Paulina">Paulina (es-MX)</option>
        <option value="Juan">Juan (es-ES)</option>
        <option value="Diego">Diego (es-AR)</option>
        <option value="auto">Auto (sistema)</option>
      </select>
    </div>
    <div class="form-group">
      <label>System Prompt</label>
      <input type="text" id="systemPrompt" value="Eres Byte IA, un asistente personal estilo JARVIS. Hablas en español, con tono profesional pero amigable, respuestas concisas. Usas humor sutil. Siempre dices 'señor' o 'señora'." />
    </div>
    <button class="save-btn" id="saveBtn">💾 Guardar</button>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="brand">Byte IA</div>
    <h1>Asistente Personal</h1>
    <div class="subtitle" id="subtitle">Toca el círculo para hablar</div>
  </div>

  <!-- Orb central -->
  <div class="orb-container">
    <div class="orb" id="orb">
      <span class="orb-icon">🎙</span>
      <div class="status-text" id="statusText">Inactivo</div>
    </div>
  </div>

  <!-- Transcript -->
  <div class="transcript" id="transcript"></div>

  <!-- Quick commands -->
  <div class="commands">
    <button class="cmd-btn" data-cmd="hola">👋 Hola</button>
    <button class="cmd-btn" data-cmd="qué hora es">🕐 Hora</button>
    <button class="cmd-btn" data-cmd="abrir youtube">📺 YouTube</button>
    <button class="cmd-btn" data-cmd="cuéntame un chiste">😄 Chiste</button>
    <button class="cmd-btn" data-cmd="ayuda">❓ Ayuda</button>
  </div>

  <script>
    // === STATE ===
    const state = {
      apiKey: localStorage.getItem("byteia:apiKey") || "",
      model: localStorage.getItem("byteia:model") || "MiniMax-Text-01",
      voice: localStorage.getItem("byteia:voice") || "Monica",
      systemPrompt: localStorage.getItem("byteia:systemPrompt") || "Eres Byte IA, un asistente personal estilo JARVIS. Hablas en español.",
      isListening: false,
      isSpeaking: false,
      recognition: null,
      synthesis: null,
    };

    // === CONVERSATION HISTORY (Mejora 3) ===
    const MAX_HISTORY = 10; // últimos 10 turnos (user + assistant = 20 mensajes)
    let conversationHistory = [];

    // === DOM ===
    const orb = document.getElementById("orb");
    const statusText = document.getElementById("statusText");
    const transcript = document.getElementById("transcript");
    const subtitle = document.getElementById("subtitle");

    // === CONFIG ===
    const apiKeyInput = document.getElementById("apiKey");
    const modelInput = document.getElementById("model");
    const voiceInput = document.getElementById("voice");
    const systemPromptInput = document.getElementById("systemPrompt");
    const saveBtn = document.getElementById("saveBtn");
    const configToggle = document.getElementById("configToggle");
    const configPanel = document.getElementById("configPanel");

    apiKeyInput.value = state.apiKey;
    modelInput.value = state.model;
    voiceInput.value = state.voice;
    systemPromptInput.value = state.systemPrompt;

    // === MARKED CONFIG (Mejora 4) ===
    if (window.marked) {
      marked.setOptions({
        breaks: true,
        gfm: true,
      });
    }

    configToggle.onclick = () => {
      configPanel.classList.toggle("open");
    };

    saveBtn.onclick = () => {
      state.apiKey = apiKeyInput.value.trim();
      state.model = modelInput.value;
      state.voice = voiceInput.value;
      state.systemPrompt = systemPromptInput.value;
      localStorage.setItem("byteia:apiKey", state.apiKey);
      localStorage.setItem("byteia:model", state.model);
      localStorage.setItem("byteia:voice", state.voice);
      localStorage.setItem("byteia:systemPrompt", state.systemPrompt);
      configPanel.classList.remove("open");
      addMessage("jarvis", "✓ Configuración guardada");
    };

    // === HELPERS ===
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // === TRANSCRIPT (Mejora 4: markdown rendering) ===
    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      const label = role === "user" ? "Tú" : "Byte";

      if (role === "jarvis" && window.marked) {
        // Render markdown para respuestas del asistente
        try {
          const html = marked.parse(text);
          div.innerHTML = `<span class="label">${label}</span><span class="markdown-content">${html}</span>`;
        } catch (e) {
          // Fallback seguro si marked falla
          div.innerHTML = `<span class="label">${label}</span>${escapeHtml(text)}`;
        }
      } else {
        // Texto plano para usuario o si marked no está disponible
        div.innerHTML = `<span class="label">${label}</span>${escapeHtml(text)}`;
      }

      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;

      // Agregar a historial (Mejora 3)
      if (role === "user" || role === "jarvis") {
        conversationHistory.push({ role, content: text });
        // Trim si excede el límite (20 mensajes = 10 turnos user+assistant)
        if (conversationHistory.length > MAX_HISTORY * 2) {
          conversationHistory = conversationHistory.slice(-MAX_HISTORY * 2);
        }
      }
    }

    // === STATE MANAGEMENT ===
    function setState(newState) {
      orb.classList.remove("listening", "thinking", "speaking", "wake-word");
      if (newState === "listening") {
        orb.classList.add("listening");
        statusText.textContent = "Escuchando... (o decí 'Oye Byte')";
      } else if (newState === "thinking") {
        orb.classList.add("thinking");
        statusText.textContent = "Pensando...";
      } else if (newState === "speaking") {
        orb.classList.add("speaking");
        statusText.textContent = "Hablando... (click para cancelar)";
      } else if (newState === "wake-word") {
        orb.classList.add("wake-word");
        statusText.textContent = "Sí, señor?";
      } else {
        statusText.textContent = "Toca el círculo para hablar";
      }
    }

    // === STT: WEB SPEECH API (Mejora 1: wake word) ===
    function initSTT() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        addMessage("jarvis", "❌ Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.");
        return null;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      recognition.interimResults = true;  // Cambiado a true para wake word
      recognition.maxAlternatives = 1;
      recognition.continuous = true;       // Cambiado a true para wake word

      let lastTranscript = "";
      let wakeWordDetected = false;
      let wakeWordTimeout = null;

      recognition.onresult = (event) => {
        let interim = "";
        let final = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcriptPart = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += transcriptPart + " ";
          } else {
            interim += transcriptPart;
          }
        }

        const fullText = (interim + " " + final).trim();
        const lower = fullText.toLowerCase();

        // Detectar wake word en interim o final
        if (lower.includes("oye byte") || lower.includes("o byte") || lower.includes("oye bite") || lower.includes("hey bite")) {
          if (!wakeWordDetected) {
            wakeWordDetected = true;
            setState("wake-word");
            // Auto-volver a idle si no hay comando en 3s
            clearTimeout(wakeWordTimeout);
            wakeWordTimeout = setTimeout(() => {
              wakeWordDetected = false;
              if (state.isListening && !state.isSpeaking) {
                setState("listening");
              }
            }, 3500);
          }

          // Si hay comando después del wake word, procesarlo
          const cmdText = fullText.replace(/oye byte|o byte|oye bite|hey bite/gi, "").trim();
          if (cmdText.length > 2 && event.results[event.results.length - 1].isFinal) {
            clearTimeout(wakeWordTimeout);
            wakeWordDetected = false;
            addMessage("user", cmdText);
            processCommand(cmdText);
          }
        }
      };

      recognition.onerror = (event) => {
        console.error("STT error:", event.error);
        if (event.error === "no-speech" || event.error === "aborted") {
          // Normal en continuous mode - no mostrar error
          return;
        }
        setState("idle");
        state.isListening = false;
        addMessage("jarvis", `Error de voz: ${event.error}`);
      };

      recognition.onend = () => {
        // En continuous mode, onend se llama cuando se detiene o hay timeout
        // Si queremos seguir escuchando, reiniciamos
        if (state.isListening && !state.isSpeaking) {
          try {
            recognition.start();
          } catch (e) {
            console.error("Failed to restart recognition:", e);
            state.isListening = false;
            setState("idle");
          }
        } else {
          state.isListening = false;
          setState("idle");
        }
      };

      return recognition;
    }

    function startListening() {
      if (state.isListening || state.isSpeaking) return;

      if (!state.recognition) {
        state.recognition = initSTT();
        if (!state.recognition) return;
      }

      try {
        state.recognition.start();
        state.isListening = true;
        setState("listening");
      } catch (e) {
        console.error("Failed to start:", e);
        setState("idle");
      }
    }

    function stopListening() {
      if (state.recognition && state.isListening) {
        state.isListening = false; // Marcar false para evitar auto-restart
        try {
          state.recognition.stop();
        } catch (e) {
          console.error("Failed to stop:", e);
        }
        setState("idle");
      }
    }

    // === TTS: Web Speech API con cancelación (Mejora 5) ===
    let currentUtterance = null;
    let currentSpeakResolve = null;

    function speak(text) {
      return new Promise((resolve) => {
        state.isSpeaking = true;
        setState("speaking");

        // Llamar a la app nativa (byte-ia-tts helper) via custom protocol
        // o usar Web Speech API como fallback
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tts) {
          // App nativa - no podemos cancelar desde JS, pero marcamos
          window.webkit.messageHandlers.tts.postMessage({ text, voice: state.voice });
          currentSpeakResolve = resolve;

          // Estimación de duración para auto-resolve
          const wordCount = text.split(' ').length;
          const estimatedMs = Math.max(1000, wordCount * 250);
          setTimeout(() => {
            state.isSpeaking = false;
            if (currentSpeakResolve === resolve) {
              currentSpeakResolve = null;
              resolve();
            }
          }, estimatedMs);
          return;
        }

        // Fallback: Web Speech API
        if (!state.synthesis) {
          state.synthesis = window.speechSynthesis;
        }

        // Cancelar cualquier utterance anterior (Mejora 5)
        state.synthesis.cancel();

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "es-ES";
        utter.rate = 1.0;
        utter.pitch = 1.0;

        // Buscar voz en español
        const voices = state.synthesis.getVoices();
        const esVoice = voices.find((v) => v.lang.startsWith("es")) || voices[0];
        if (esVoice) utter.voice = esVoice;

        currentUtterance = utter;
        currentSpeakResolve = resolve;

        utter.onend = () => {
          state.isSpeaking = false;
          currentUtterance = null;
          if (currentSpeakResolve === resolve) {
            currentSpeakResolve = null;
            setState("idle");
            resolve();
          }
        };

        utter.onerror = () => {
          state.isSpeaking = false;
          currentUtterance = null;
          if (currentSpeakResolve === resolve) {
            currentSpeakResolve = null;
            setState("idle");
            resolve();
          }
        };

        state.synthesis.speak(utter);
      });
    }

    // === CANCEL SPEAKING (Mejora 5) ===
    function stopSpeaking() {
      if (!state.isSpeaking) return;

      if (state.synthesis) {
        state.synthesis.cancel();
      }

      state.isSpeaking = false;
      currentUtterance = null;

      if (currentSpeakResolve) {
        const resolve = currentSpeakResolve;
        currentSpeakResolve = null;
        resolve();
      }

      setState("idle");
      addMessage("jarvis", "⏹️ Cancelado");
    }

    // === TOOLS / FUNCTION CALLING (Mejora 2) ===
    const TOOLS = [
      {
        type: "function",
        function: {
          name: "get_time",
          description: "Obtiene la hora y fecha actual. Úsala cuando el usuario pregunte qué hora es o qué día es hoy.",
          parameters: {
            type: "object",
            properties: {},
          },
        },
      },
      {
        type: "function",
        function: {
          name: "open_url",
          description: "Abre una URL en el navegador del usuario. Úsala cuando pidan abrir youtube, google, gmail, etc.",
          parameters: {
            type: "object",
            properties: {
              url: {
                type: "string",
                description: "URL o dominio a abrir (ej: 'youtube.com', 'https://google.com')",
              },
            },
            required: ["url"],
          },
        },
      },
      {
        type: "function",
        function: {
          name: "web_search",
          description: "Busca información en la web usando DuckDuckGo. Úsala cuando el usuario pida buscar algo.",
          parameters: {
            type: "object",
            properties: {
              query: {
                type: "string",
                description: "Término de búsqueda",
              },
            },
            required: ["query"],
          },
        },
      },
      {
        type: "function",
        function: {
          name: "calculator",
          description: "Evalúa expresiones matemáticas. Úsala para cálculos numéricos.",
          parameters: {
            type: "object",
            properties: {
              expression: {
                type: "string",
                description: "Expresión matérica válida (ej: '2+2', '15*4', 'sqrt(16)')",
              },
            },
            required: ["expression"],
          },
        },
      },
      {
        type: "function",
        function: {
          name: "get_weather",
          description: "Consulta el clima de una ciudad. Requiere API key de OpenWeather configurada.",
          parameters: {
            type: "object",
            properties: {
              city: {
                type: "string",
                description: "Nombre de la ciudad",
              },
            },
            required: ["city"],
          },
        },
      },
      {
        type: "function",
        function: {
          name: "system_command",
          description: "Ejecuta un comando del sistema permitido (open, say, date). Solo whitelist.",
          parameters: {
            type: "object",
            properties: {
              command: {
                type: "string",
                description: "Comando a ejecutar",
              },
            },
            required: ["command"],
          },
        },
      },
    ];

    // === TOOL EXECUTOR (Mejora 2) ===
    async function executeTool(name, argsJson) {
      let args = {};
      try {
        args = typeof argsJson === "string" ? JSON.parse(argsJson) : argsJson;
      } catch (e) {
        return `Error: argumentos inválidos para ${name}`;
      }

      try {
        switch (name) {
          case "get_time": {
            const now = new Date();
            const date = now.toLocaleDateString("es", {
              weekday: "long",
              year: "numeric",
              month: "long",
              day: "numeric",
            });
            const time = now.toLocaleTimeString("es", {
              hour: "2-digit",
              minute: "2-digit",
            });
            return `Fecha: ${date}. Hora: ${time}`;
          }

          case "open_url": {
            let url = (args.url || "").trim();
            if (!url) return "Error: URL vacía";

            // Auto-agregar https:// si no tiene protocolo
            if (!url.match(/^https?:\/\//i)) {
              url = "https://" + url;
            }
            window.open(url, "_blank");
            return `URL abierta: ${url}`;
          }

          case "web_search": {
            const query = (args.query || "").trim();
            if (!query) return "Error: búsqueda vacía";
            const searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            window.open(searchUrl, "_blank");
            return `Búsqueda abierta en DuckDuckGo: "${query}"`;
          }

          case "calculator": {
            const expr = (args.expression || "").trim();
            if (!expr) return "Error: expresión vacía";

            // Whitelist segura: solo dígitos, operadores, paréntesis, espacios y punto
            const safe = expr.replace(/[^0-9+\-*/().,\s]/g, "");
            if (safe !== expr) {
              return `Error: caracteres no permitidos en "${expr}"`;
            }

            try {
              // Usar Function en lugar de eval (más seguro)
              const result = Function('"use strict"; return (' + safe + ')')();
              return `${expr} = ${result}`;
            } catch (e) {
              return `Error evaluando "${expr}": ${e.message}`;
            }
          }

          case "get_weather": {
            const city = (args.city || "").trim();
            const apiKey = localStorage.getItem("byteia:weatherKey") || "";
            if (!apiKey) {
              return `No tengo API key de OpenWeather configurada. Por ahora podés consultar el clima en https://weather.com o pedime que abra "${city}" ahí.`;
            }
            try {
              const resp = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric&lang=es`
              );
              if (!resp.ok) {
                return `Error consultando clima: ${resp.status}`;
              }
              const data = await resp.json();
              const temp = Math.round(data.main.temp);
              const desc = data.weather[0].description;
              const feels = Math.round(data.main.feels_like);
              return `Clima en ${city}: ${temp}°C (sensación ${feels}°C), ${desc}`;
            } catch (e) {
              return `Error consultando clima: ${e.message}`;
            }
          }

          case "system_command": {
            // Whitelist solo comandos seguros
            const allowed = ["open", "say", "date", "cal", "ls", "pwd"];
            const cmd = (args.command || "").trim().split(/\s+/)[0];
            if (!allowed.includes(cmd)) {
              return `Comando "${cmd}" no permitido. Permitidos: ${allowed.join(", ")}`;
            }
            // Web no puede ejecutar shell directamente, pero podemos sugerir
            return `Para ejecutar "${args.command}" necesito un helper nativo de macOS. Por ahora podés abrir Terminal y correrlo manualmente.`;
          }

          default:
            return `Tool "${name}" no implementada`;
        }
      } catch (e) {
        console.error(`Tool ${name} error:`, e);
        return `Error ejecutando ${name}: ${e.message}`;
      }
    }

    // === LLM: MiniMax API con tools + history (Mejoras 2 y 3) ===
    async function callLLM(userMessage) {
      if (!state.apiKey) {
        addMessage("jarvis", "⚠️ Configura tu API key primero. Click en ⚙ arriba a la derecha.");
        return null;
      }

      setState("thinking");

      try {
        // Construir mensajes: system + history + user message actual
        const messages = [
          { role: "system", content: state.systemPrompt },
          ...conversationHistory.slice(-MAX_HISTORY * 2),
          { role: "user", content: userMessage },
        ];

        // Primera llamada: con tools disponibles
        const response = await fetch("https://api.MiniMax.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${state.apiKey}`,
          },
          body: JSON.stringify({
            model: state.model,
            messages: messages,
            tools: TOOLS,
            tool_choice: "auto",
            max_tokens: 800,
            temperature: 0.7,
          }),
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(`API error: ${response.status} - ${err}`);
        }

        const data = await response.json();
        const message = data.choices[0].message;

        // Si el LLM quiere usar tools
        if (message.tool_calls && message.tool_calls.length > 0) {
          console.log("Tool calls:", message.tool_calls);

          // Agregar mensaje del assistant con tool_calls
          messages.push(message);

          // Ejecutar cada tool
          for (const toolCall of message.tool_calls) {
            const toolName = toolCall.function.name;
            const toolArgs = toolCall.function.arguments;
            const result = await executeTool(toolName, toolArgs);

            // Agregar resultado como mensaje "tool"
            messages.push({
              role: "tool",
              tool_call_id: toolCall.id,
              content: result,
            });
          }

          // Segunda llamada para que el LLM genere respuesta final con resultados
          const finalResponse = await fetch("https://api.MiniMax.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${state.apiKey}`,
            },
            body: JSON.stringify({
              model: state.model,
              messages: messages,
              max_tokens: 800,
              temperature: 0.7,
            }),
          });

          if (!finalResponse.ok) {
            const err = await finalResponse.text();
            throw new Error(`API error (final): ${finalResponse.status} - ${err}`);
          }

          const finalData = await finalResponse.json();
          return finalData.choices[0].message.content;
        }

        // Sin tool calls: respuesta directa
        return message.content;
      } catch (e) {
        console.error("LLM error:", e);
        return null;
      }
    }

    // === PROCESS COMMAND ===
    async function processCommand(text) {
      const lower = text.toLowerCase().trim();

      // Comandos locales (instantáneos) - shortcuts para evitar round-trip al LLM
      if (lower.includes("abrir youtube")) {
        const msg = "Abriendo YouTube...";
        addMessage("jarvis", msg);
        window.open("https://youtube.com", "_blank");
        await speak(msg);
        return;
      }

      if (lower.includes("qué hora es") || lower.includes("que hora es")) {
        const time = new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
        const msg = `Son las ${time}, señor.`;
        addMessage("jarvis", msg);
        await speak(msg);
        return;
      }

      if (lower === "hola" || lower === "hola byte" || lower === "buenos días" || lower === "buenas tardes") {
        const greeting = "Hola, señor. ¿En qué puedo ayudarle?";
        addMessage("jarvis", greeting);
        await speak(greeting);
        return;
      }

      if (lower.includes("ayuda") || lower === "qué puedes hacer" || lower === "que puedes hacer") {
        const helpText = "Puedo **responder preguntas**, abrir páginas web, **buscar en la web**, hacer cálculos, y más. Decime 'Oye Byte' antes de tu pedido para activarme, o simplemente tocá el círculo. Probá: *qué hora es*, *abrir gmail*, o *buscar noticias de IA*.";
        addMessage("jarvis", helpText);
        await speak("Puedo responder preguntas, abrir páginas web, buscar en la web, hacer cálculos, y más. Decime 'Oye Byte' antes de tu pedido para activarme, o simplemente tocá el círculo.");
        return;
      }

      if (lower.includes("cancelar") && state.isSpeaking) {
        stopSpeaking();
        return;
      }

      // LLM (con tools + context)
      const response = await callLLM(text);
      if (response) {
        addMessage("jarvis", response);
        await speak(response);
      } else {
        const error = "Disculpe, no pude procesar su solicitud. Verifique su API key.";
        addMessage("jarvis", error);
        await speak(error);
      }
    }

    // === EVENTOS ===

    // Click en orb: toggle listening OR cancel speaking (Mejora 5)
    orb.addEventListener("click", () => {
      if (state.isSpeaking) {
        stopSpeaking();
        return;
      }
      if (state.isListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    // Quick commands
    document.querySelectorAll(".cmd-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const cmd = btn.getAttribute("data-cmd");
        addMessage("user", cmd);
        processCommand(cmd);
      });
    });

    // Atajos de teclado
    document.addEventListener("keydown", (e) => {
      // Ignorar si está escribiendo en un input
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

      // Esc: cancelar speaking o listening (Mejora 5)
      if (e.key === "Escape") {
        if (state.isSpeaking) {
          e.preventDefault();
          stopSpeaking();
        } else if (state.isListening) {
          e.preventDefault();
          stopListening();
        }
        return;
      }

      // Space: toggle listening
      if (e.code === "Space") {
        e.preventDefault();
        if (state.isListening) {
          stopListening();
        } else if (!state.isSpeaking) {
          startListening();
        }
      }
    });

    // Init
    setState("idle");
    addMessage("jarvis", "Hola, señor. Byte IA está listo. **Decí 'Oye Byte'** antes de hablar, o tocá el círculo.");
  </script>
